<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantômes — Ton diagnostic en 6 questions</title>
<meta name="description" content="6 questions pour chiffrer ce que te coûtent tes abonnements oubliés.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--ink:#1B1A17;--mute:#5E5A50;--accent:#D9381E;--card:#FFFFFF;--line:#DDD5C3}
@media (prefers-color-scheme:dark){:root{--bg:#14130F;--ink:#F3EDE0;--mute:#B0A999;--accent:#FF6A4D;--card:#1E1C17;--line:#35322A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Figtree,system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:0 20px 40px}
.top{padding:18px 0 8px}
.logo{font-family:Fraunces,serif;font-weight:900;font-size:1.25rem;color:var(--ink);text-decoration:none}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
h1{font-family:Fraunces,Georgia,serif;font-weight:900;font-size:1.9rem;line-height:1.1;margin:28px 0 22px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;font:600 1.05rem Figtree,sans-serif;min-height:56px;cursor:pointer}
.opt:active{border-color:var(--accent)}
.back{background:none;border:0;color:var(--mute);font:600 .95rem Figtree,sans-serif;padding:12px 0;cursor:pointer}
.n{font-size:.85rem;color:var(--mute);margin:24px 0 0}
.big{font-family:Fraunces,serif;font-weight:900;font-size:4rem;color:var(--accent);line-height:1;margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}
.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:1.1rem;padding:18px;border-radius:14px}
</style>
</head>
<body>
<div class="w">
<div class="top"><a class="logo" href="/">Fantômes</a><div class="bar"><i id="b"></i></div></div>
<main id="m"></main>
</div>
<script>
var Q=[
{t:"Combien d'abonnements penses-tu avoir (streaming, applis, sport, cloud...) ?",o:[["1 à 3",2],["4 à 6",5],["7 à 10",8],["Plus de 10",12]]},
{t:"Parmi eux, combien sont oubliés ou presque jamais utilisés ?",o:[["Aucun",0],["1 ou 2",2],["3 à 5",4],["Plus de 5",6]]},
{t:"Combien paie-t-on en moyenne chaque mois pour l'un d'eux ?",o:[["Moins de 5 €",4],["Entre 5 et 10 €",8],["Entre 10 et 20 €",14],["Plus de 20 €",25]]},
{t:"Depuis combien de temps paies-tu le plus ancien ?",o:[["Moins de 6 mois",0.5],["Environ 1 an",1],["2 à 3 ans",2.5],["Plus de 3 ans",4]]},
{t:"As-tu déjà oublié de résilier un essai gratuit ?",o:[["Oui, plusieurs fois",1],["Une fois ou deux",2],["Jamais",3]]},
{t:"Qu'est-ce qui t'empêche de résilier ?",o:[["Je ne sais pas lesquels je paie",1],["La flemme de la démarche",2],["Je ne sais pas comment écrire la lettre",3],["Rien, je n'y ai jamais pensé",4]]}
];
var a=[],i=0,m=document.getElementById("m"),b=document.getElementById("b");
function eur(x){return Math.round(x).toLocaleString("fr-FR")+" €"}
function show(){
b.style.width=(i/Q.length*100)+"%";
if(i>=Q.length)return calc();
var q=Q[i],h='<h1>'+q.t+'</h1>';
q.o.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+o[0]+'</button>'});
if(i>0)h+='<button class="back" id="bk">← Retour</button>';
m.innerHTML=h;
m.querySelectorAll(".opt").forEach(function(e){e.onclick=function(){a[i]=q.o[+e.dataset.k][1];i++;show();window.scrollTo(0,0)}});
var bk=document.getElementById("bk");if(bk)bk.onclick=function(){i--;show()};
}
function calc(){
var n=a[1],p=a[2],mois=n*p,an=mois*12,perdu=an*a[3];
try{localStorage.setItem("fantomes",JSON.stringify({a:a,mois:mois,an:an}))}catch(e){}
if(n===0){m.innerHTML='<h1>Tu dis n\'avoir aucun abonnement oublié.</h1><div class="card">Bonne nouvelle. Mais les petits prélèvements se cachent bien : ton relevé le confirmera, ou pas.</div><a class="btn" href="/">Retour à l\'accueil</a>';return}
m.innerHTML='<p class="n">Ton diagnostic</p><div class="big">'+eur(an)+'</div><p>par an, c\'est ce que te coûtent <b>'+n+' abonnements</b> que tu n\'utilises pas vraiment.</p>'
+'<div class="card"><b>'+eur(mois)+' chaque mois.</b><br>Depuis le début, tu as déjà laissé partir environ <b>'+eur(perdu)+'</b>.</div>'
+'<p class="n">Estimation basée sur tes réponses. Ton relevé donnera le chiffre exact.</p>'
+'<p>Prochaine étape : déposer ton relevé pour retrouver chaque prélèvement.</p>'
+'<a class="btn" href="releve.html">Déposer mon relevé</a>';
}
show();
</script>
</body>
</html>
